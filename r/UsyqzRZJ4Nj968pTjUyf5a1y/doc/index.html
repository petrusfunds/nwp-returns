<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#4a1626"><title>New World Portfolio — Document</title>
<link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{--wine:#4a1626;--wine2:#2e0d17;--gold-l:#d8b765;--bg:#faf8f8;--fg:#221a1c;--muted:#6f6266;--f-d:"Cormorant Garamond",Georgia,serif;--f-b:"DM Sans","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#160a0e;--fg:#efe7e8;--muted:#b3a3a7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#160a0e;--fg:#efe7e8;--muted:#b3a3a7;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);display:flex;flex-direction:column;min-height:100dvh}
header{position:sticky;top:0;z-index:2;background:linear-gradient(160deg,var(--wine),var(--wine2));color:#f5ecd9;
 padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.bar{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.retour{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;font:600 16px var(--f-b);color:#2e0d17;background:var(--gold-l);
 border-radius:999px;text-decoration:none;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.retour:hover,.retour:focus-visible{background:#e9cf8a}
.retour span{font-size:20px;line-height:1}
h1{font-family:var(--f-d);font-weight:600;font-size:1.6rem;line-height:1.1;margin:0;flex:1 1 220px}
.dl{font-size:13px;color:#e2d3c8;text-decoration:none;border-bottom:1px solid rgba(216,183,101,.5);white-space:nowrap}
main{flex:1;display:flex}
iframe{flex:1;width:100%;min-height:calc(100dvh - 90px);border:0;background:#fff}
.err{max-width:980px;margin:24px auto;padding:0 16px;color:var(--muted)}
</style></head><body>
<header><div class="bar"><a class="retour" href="../"><span aria-hidden="true">←</span> <b id="lr">Retour aux performances</b></a>
<h1 id="t"></h1><a class="dl" id="dl" href="#" rel="noopener">Télécharger le PDF</a></div></header>
<main id="m"></main>
<script>
(function(){
const TX={fr:{r:"Retour aux performances",d:"Télécharger le PDF",s:"Synthèse",p:"Rapport mensuel",e:"Document introuvable."},
 nl:{r:"Terug naar de rendementen",d:"PDF downloaden",s:"Synthese",p:"Maandrapport",e:"Document niet gevonden."},
 en:{r:"Back to returns",d:"Download the PDF",s:"Summary",p:"Monthly report",e:"Document not found."}};
const q=new URLSearchParams(location.search);
let l=q.get('l');if(!TX[l]){try{l=localStorage.getItem('nwp-lang')}catch(e){}}if(!TX[l])l='en';
const t=TX[l];document.documentElement.lang=l;
document.getElementById('lr').textContent=t.r;
const id=q.get('id')||'';const ok=/^[A-Za-z0-9_-]{10,80}$/.test(id);
const k=q.get('k'),d=(q.get('d')||'').replace(/[^0-9\/]/g,''),src=(q.get('s')||'').replace(/[^a-z]/g,'').toUpperCase();
const titre=(k==='rapport'?t.p:t.s)+(d?' '+d:'')+(src&&src!==l.toUpperCase()?' ('+src+')':'');
document.getElementById('t').textContent=titre;document.title='NWP — '+titre;
const dl=document.getElementById('dl'),m=document.getElementById('m');
if(ok){dl.textContent=t.d;dl.href='https://drive.google.com/uc?export=download&id='+id;
 const f=document.createElement('iframe');f.src='https://drive.google.com/file/d/'+id+'/preview';f.title=titre;f.allow='fullscreen';m.appendChild(f);}
else{dl.remove();const p=document.createElement('p');p.className='err';p.textContent=t.e;m.appendChild(p);}
})();
</script></body></html>
